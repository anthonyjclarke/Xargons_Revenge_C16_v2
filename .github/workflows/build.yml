name: Reassemble Xargon's Revenge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cc65 and PlatformIO
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 unzip
          python -m pip install platformio==6.1.19
      - name: Record tool versions
        run: python scripts/tool_check.py
      - name: Build from preserved sources
        run: python scripts/restore_c16.py
      - name: Test syntax, provenance and object records (VICE tests skip without xplus4)
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Build all PlatformIO environments
        run: pio run -e c16 -e c16_debug -e c16_v2
      - name: Check output agreement for both game versions
        run: |
          for v in 1 2; do
            for e in c16 c16_debug c16_v2; do
              cmp build/xargons-revenge-v$v.prg build/platformio/$e/xargons-revenge-v$v.prg
            done
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the HTML handbook is current
        run: node scripts/build_docs.mjs --check
      - name: Test the handbook generator
        run: node --test test/test_docs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: xargons-revenge-c16
          path: |
            build/xargons-revenge-v1.prg
            build/xargons-revenge-v2.prg
            build/aliens-v1.s
            build/aliens-v2.s
            build/comparison.json
            build/recovery-manifest.json
            build/tool-checks.json
            build/revenge.s
            build/revenge.labels
            build/revenge.map
            build/revenge.dbg
