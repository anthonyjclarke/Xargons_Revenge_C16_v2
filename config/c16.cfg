# Original fixed-origin memory layout for REVENGE, ca65/ld65.
# VARS starts at $02, EXTRA-MEMORY at $0200 and the game at $1800.
# The font at $3800 is a separate binary, so the code region stops there.
MEMORY {
    ZP: start = $0002, size = $00FE, file = "";
    EXTRA: start = $0200, size = $0200, file = "";
    GAME: start = $1800, size = $2000, file = %O;
}
SEGMENTS {
    AT_0002: load = ZP, type = zp;
    AT_0200: load = EXTRA, type = bss;
    AT_1800: load = GAME, type = ro;
}
