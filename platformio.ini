[platformio]
default_envs = c16
build_dir = build/platformio

[env:c16]
platform = platformio/native@1.2.1
extra_scripts = pre:scripts/build_6502.py
build_type = release
upload_protocol = custom
custom_game_version = 1

[env:c16_debug]
extends = env:c16
build_type = debug

; Same build and bytes; upload runs game v2 (cassette release) instead of v1.
[env:c16_v2]
extends = env:c16
custom_game_version = 2
